name: Haechong GitHub App primary mission continuity
on:
  push:
    branches: [kmong-productization]
    paths:
      - 'HANDOFF.md'
      - 'STATUS.md'
      - 'AGENTS.md'
      - 'data/haechong_active_mission_20261115.json'
      - 'tools/haechong_mission_guard/**'
      - '.github/workflows/haechong-mission-lock.yml'
  pull_request:
    branches: [kmong-productization]
    paths:
      - 'HANDOFF.md'
      - 'STATUS.md'
      - 'AGENTS.md'
      - 'data/haechong_active_mission_20261115.json'
      - 'tools/haechong_mission_guard/**'
      - '.github/workflows/haechong-mission-lock.yml'
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail if latest handoff displaces owner GitHub App mission
        run: python3 -B tools/haechong_mission_guard/check.py
      - name: Adversarial role-switch regression tests
        run: python3 -B -m unittest discover -s tools/haechong_mission_guard -p 'test_*.py' -v
